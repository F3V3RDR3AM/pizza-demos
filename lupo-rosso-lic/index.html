<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Slice Builder Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a pizzeria counter. Main column = menu board or build station (tabs). Side column = paper order ticket, sticky on desktop. Phones stack, with a bottom order bar. */
:root{
  --awning:#0f3b36;      /* page ground, old-school awning green */
  --awning-2:#16504a;    /* raised panels */
  --awning-3:#1e6159;    /* hover / borders */
  --cheese:#ffcf4d;      /* accent */
  --tomato:#e5482f;      /* prices, call to action */
  --basil:#3fae5a;
  --cream:#fbf3e2;       /* text, ticket paper */
  --ink:#2a211b;         /* text on paper */
  --muted:#a9c7bf;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Courier Prime","Courier New",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--awning);color:var(--cream)}
body{font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 20% 0%,rgba(255,207,77,.08),transparent 40%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 40px,transparent 40px 80px);}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}

.ribbon{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;
  background:var(--cheese);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.ribbon b{font-family:var(--display);font-weight:400;letter-spacing:.03em}

/* header */
header.shop{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;margin:18px 0 16px}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.logo{width:84px;height:84px;flex:0 0 84px;border-radius:50%;overflow:hidden;background:var(--cream)}
.logo img,.logo svg{width:100%;height:100%;display:block;object-fit:cover}
.shop h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,50px);line-height:1;margin:0;text-wrap:balance;color:var(--cream);text-shadow:3px 3px 0 var(--tomato)}
.shop .tag{color:var(--muted);margin:6px 0 0;font-size:15px}
.info{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.info strong{color:var(--cream);font-weight:600}
.open-pill{display:inline-block;background:var(--awning-3);color:var(--cheese);border-radius:99px;padding:2px 10px;font-weight:600}

main.counter{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
@media (max-width:900px){main.counter{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.panel{background:var(--awning-2);border-radius:18px;padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.03em;margin:0 0 4px;color:var(--cheese)}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--awning);border-radius:14px;padding:5px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 8px;font-family:var(--display);font-size:15px;letter-spacing:.02em;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--cheese);color:var(--ink)}

/* menu board */
.sec + .sec{margin-top:22px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head span{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--awning);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{position:relative;aspect-ratio:4/3;background:radial-gradient(circle at 50% 50%,#5b3a24 0 55%,#3c2617 56%);max-width:100%}
.thumb.side-item{background:radial-gradient(circle at 50% 55%,#24645b 0 45%,#174a44 46%)}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:var(--tomato);color:#fff;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-body .nm{font-weight:800;font-size:15px;line-height:1.2}
.card-body .ds{color:var(--muted);font-size:13px;flex:1}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.card-foot .pr{font-family:var(--display);color:var(--cheese);font-size:17px;flex:1 0 100%;font-variant-numeric:tabular-nums}
.card-foot .mini{flex:1}
.mini{border:0;border-radius:8px;padding:7px 11px;font-weight:800;font-size:13px}
.mini.add{background:var(--cheese);color:var(--ink)}
.mini.cust{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--awning-3)}
.mini.added{background:var(--basil);color:var(--ink)}

/* format carousel */
.carousel{position:relative;user-select:none;-webkit-user-select:none}
.viewport{overflow:hidden;border-radius:14px;touch-action:pan-y;cursor:grab}
.viewport.dragging{cursor:grabbing}
.track{display:flex;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.viewport.dragging .track{transition:none}
.fmt{flex:0 0 100%;display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 56px;background:var(--awning);min-height:74px}
.fmt .nm{font-family:var(--display);font-size:22px;line-height:1.05}
.fmt .ds{color:var(--muted);font-size:13px}
.fmt .pr{font-family:var(--display);color:var(--cheese);font-size:20px;white-space:nowrap}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:var(--cheese);color:var(--ink);font-size:20px;font-weight:800;display:grid;place-items:center;z-index:2}
.arrow.l{left:8px}.arrow.r{right:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--awning-3);padding:0}
.dots button.on{background:var(--cheese);width:22px;border-radius:9px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sizes:empty{display:none}
.sizes button{border:2px solid var(--awning-3);background:transparent;border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.sizes button.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}

/* build station: toppings beside the pizza */
.station{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.tray-wrap h3,.stage-wrap h3{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.03em;margin:0 0 6px;color:var(--cheese)}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.top{touch-action:none;border:2px solid var(--awning-3);background:var(--awning);border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;font-size:12px;font-weight:600;line-height:1.15;position:relative}
.top:hover{border-color:var(--cheese)}
.top.on{border-color:var(--cheese);background:var(--awning-3)}
.top.on::after{content:"✓";position:absolute;top:3px;right:6px;color:var(--cheese);font-weight:800}
.top svg{width:42px;height:42px;pointer-events:none}
.top small{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .station{grid-template-columns:minmax(0,1fr)}
  .tray{display:flex;overflow-x:auto;overflow-y:hidden;max-height:none;gap:8px;padding-bottom:6px;scroll-snap-type:x proximity}
  .top{flex:0 0 92px;scroll-snap-align:start;touch-action:pan-x}
  .fmt{padding:10px 54px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
  .fmt .nm{font-size:20px}.fmt .pr{font-size:16px}
}
.stage{position:relative;border-radius:16px;background:radial-gradient(circle at 50% 45%,#5b3a24 0 56%,#3c2617 57% 100%);aspect-ratio:1/1;max-width:100%;overflow:hidden}
.stage.hot{box-shadow:0 0 0 4px var(--cheese) inset}
.stage svg{width:100%;height:100%;display:block}
.drop-msg{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--cheese);opacity:.9;pointer-events:none;padding:0 12px}
.piece{transform-box:fill-box;transform-origin:center}
.piece.new{animation:plop .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes plop{from{transform:translateY(-40px) scale(1.6);opacity:0}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cream);color:var(--ink);border:0;border-radius:99px;padding:4px 6px 4px 12px;font-weight:600;font-size:13px}
.chip span{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-size:12px;line-height:1}
.chips .empty{color:var(--muted);font-size:13px;align-self:center}
.ghost{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:50;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.buildbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.buildbar .lp{font-weight:600}
.buildbar b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--cheese);font-variant-numeric:tabular-nums;margin-left:8px}

/* ticket */
.ticket{background:var(--cream);color:var(--ink);font-family:var(--mono);border-radius:4px;padding:16px 16px 18px;
  -webkit-mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/18px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/18px 100% repeat-x}
.ticket h3{font-family:var(--mono);margin:6px 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.line.sub{font-size:12px;color:#6b5a4c;margin-bottom:4px}
.line .q{display:inline-flex;gap:4px;align-items:center}
.line .q button{border:1px solid var(--ink);background:transparent;width:20px;height:20px;border-radius:4px;line-height:1;padding:0;color:var(--ink)}
.rule{border:0;border-top:2px dashed #b8a993;margin:10px 0}
.total{font-weight:700;font-size:17px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 16px;font-family:var(--display);font-size:17px;letter-spacing:.03em}
.btn.add{background:var(--cheese);color:var(--ink);width:auto;padding:12px 22px}
.btn.add:active{transform:translateY(2px)}
.btn.order{background:var(--tomato);color:#fff;margin-top:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pickup{display:flex;gap:6px;margin-top:10px}
.pickup button{flex:1;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px;font-family:var(--mono);font-weight:700}
.pickup button.on{background:var(--ink);color:var(--cream)}

/* phone order bar */
.orderbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tomato);color:#fff;border:0;display:flex;justify-content:space-between;align-items:center;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-family:var(--display);font-size:16px;width:100%}
@media (min-width:901px){.orderbar{display:none!important}}
@media (max-width:900px){.wrap{padding-block:18px 90px}}

.overlay{position:fixed;inset:0;background:rgba(6,24,22,.82);display:grid;place-items:center;z-index:60;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.done{background:var(--cream);color:var(--ink);border-radius:20px;max-width:420px;width:100%;padding:26px 22px;text-align:center}
.done .no{font-family:var(--display);font-size:46px;color:var(--tomato);line-height:1;margin:6px 0}
.done p{margin:6px 0}
.done .btn{background:var(--awning);color:var(--cream);margin-top:16px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
footer{color:var(--muted);font-size:12px;margin-top:22px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- ============================================================

     menu[].items[]: a pizza item names a "format" (and "size" for pies)
     plus "toppings", so its picture is drawn from them and "Customize"

     URL. Optional "theme" sets colors (awning, awning-2, awning-3, cheese,
     tomato, muted). Formats take shape round | deep | slice | rect and an
     optional defaultSize index.
     ============================================================ -->

<div class="wrap">
  <div class="ribbon"><span><b>PREVIEW</b> &nbsp;Built for <span id="builtFor"></span></span><span id="pitchNote"></span></div>

  <header class="shop">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div style="min-width:0">
        <h1 id="shopName"></h1>
        <p class="tag" id="shopTag"></p>
      </div>
    </div>
    <div class="info">
      <span class="open-pill" id="shopHours"></span>
      <span><strong id="shopAddr"></strong></span>
      <span id="phoneWrap">Call <strong id="shopPhone"></strong></span>
    </div>
  </header>

  <main class="counter">
    <div style="min-width:0">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabMenu" aria-selected="true" aria-controls="viewMenu">Favorites &amp; specials</button>
        <button role="tab" id="tabBuild" aria-selected="false" aria-controls="viewBuild">Build your own</button>
      </div>

      <section class="panel" id="viewMenu" role="tabpanel" aria-labelledby="tabMenu"></section>

      <section class="panel" id="viewBuild" role="tabpanel" aria-labelledby="tabBuild" hidden>
        <h2>1. Swipe your style</h2>
        <div class="carousel">
          <button class="arrow l" id="prev" aria-label="Previous style">‹</button>
          <div class="viewport" id="viewport" tabindex="0" aria-roledescription="carousel" aria-label="Pizza style. Swipe or use arrow keys.">
            <div class="track" id="track"></div>
          </div>
          <button class="arrow r" id="next" aria-label="Next style">›</button>
        </div>
        <div class="dots" id="dots"></div>
        <div class="sizes" id="sizes"></div>

        <div class="station">
          <div class="tray-wrap">
            <h3>2. Drag on toppings</h3>
            <p class="hint">Drag one onto the pizza, or tap it.</p>
            <div class="tray" id="tray"></div>
          </div>
          <div class="stage-wrap">
            <div class="stage" id="stage">
              <svg id="pizza" viewBox="0 0 400 400" aria-label="Your pizza"></svg>
              <div class="drop-msg" id="dropMsg">Drop toppings here</div>
            </div>
            <div class="chips" id="chips"></div>
          </div>
        </div>
        <div class="buildbar">
          <span class="lp"><span id="buildLabel"></span><b id="buildPrice"></b></span>
          <button class="btn add" id="addBtn">3. Add to order</button>
        </div>
      </section>
    </div>

    <aside class="side" aria-label="Your order">
      <div class="ticket" id="ticket" aria-live="polite">
        <h3><span>Order ticket</span><span id="ticketNo">#—</span></h3>
        <div id="lines"></div>
        <hr class="rule">
        <div class="line total"><span>Total</span><span id="total">$0.00</span></div>
        <div class="pickup" role="group" aria-label="Pickup or delivery">
          <button class="on" data-mode="Pickup">Pickup</button>
          <button data-mode="Delivery">Delivery</button>
        </div>
        <button class="btn order" id="orderBtn" disabled>Place order</button>
      </div>
    </aside>
  </main>
  <footer id="foot"></footer>
</div>

<button class="orderbar" id="orderbar" hidden><span id="obCount"></span><span id="obTotal"></span></button>

<div class="overlay" id="overlay" hidden>
  <div class="done" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <p style="font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px" id="doneTitle">Order in the oven</p>
    <div class="no" id="doneNo"></div>
    <p id="doneMsg"></p>
    <p style="font-size:12px;color:#6b5a4c" id="doneNote"></p>
    <button class="btn" id="again">Start a new order</button>
  </div>
</div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
  const D = JSON.parse(document.getElementById('menu-data').textContent);
  const $ = id => document.getElementById(id);
  const cur = D.shop.currency || '$';
  const money = n => cur + n.toFixed(2);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function pizzaMarkup(shapeKey, tops, opts = {}) {

  vp.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(S.f - 1); if (e.key === 'ArrowRight') go(S.f + 1); });
  function go(i) {
    const n = D.formats.length; S.f = (i + n) % n; S.size = fmt().sizes ? (fmt().defaultSize != null ? fmt().defaultSize : fmt().sizes.length - 1) : 0;
    const max = fmt().maxToppings || 99; if (S.tops.length > max) S.tops = S.tops.slice(0, max);
    track.style.transform = `translateX(${-S.f * 100}%)`;
    [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === S.f));
    renderSizes(); renderAll();
  }
  let sx = null, dx = 0;
  vp.addEventListener('pointerdown', e => { sx = e.clientX; dx = 0; vp.setPointerCapture(e.pointerId); vp.classList.add('dragging'); });
  vp.addEventListener('pointermove', e => { if (sx === null) return; dx = e.clientX - sx; track.style.transform = `translateX(calc(${-S.f * 100}% + ${dx}px))`; });
  const endSwipe = () => { if (sx === null) return; vp.classList.remove('dragging'); sx = null; if (dx < -50) go(S.f + 1); else if (dx > 50) go(S.f - 1); else go(S.f); };
  vp.addEventListener('pointerup', endSwipe); vp.addEventListener('pointercancel', endSwipe);

  function renderSizes() {
    const f = fmt(); const box = $('sizes');
    box.innerHTML = f.sizes ? f.sizes.map((s, i) => `<button data-i="${i}" class="${i === S.size ? 'on' : ''}">${esc(s.label)} · ${money(s.price)}</button>`).join('') : '';
  }
  $('sizes').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.size = +b.dataset.i; renderSizes(); renderAll(); });

  // ---------- topping tray + drag ----------
  const tray = $('tray');
  function renderTray() {
    const keep = tray.scrollLeft;
    tray.innerHTML = D.toppings.map(t => `<button class="top ${S.tops.includes(t.id) ? 'on' : ''}" data-id="${t.id}" aria-pressed="${S.tops.includes(t.id)}">
      <svg viewBox="-22 -22 44 44"><g transform="scale(1.15)">${art(t)}</g></svg>${esc(t.name)}<small>+${money(unitTopPrice(t))}</small></button>`).join('');
    tray.scrollLeft = keep;
  }
  function addTop(id) {
    if (S.tops.includes(id)) { pulse(); return; }
    const max = fmt().maxToppings || 99;
    if (S.tops.length >= max) { flashHint(`A ${fmt().name.toLowerCase()} takes up to ${max} toppings.`); return; }
    S.tops.push(id); S.fresh = id; renderAll();
  }
  function removeTop(id) { S.tops = S.tops.filter(x => x !== id); renderAll(); }
  function pulse() { const st = $('stage'); st.classList.add('hot'); setTimeout(() => st.classList.remove('hot'), 250); }
  function flashHint(msg) { const m = $('dropMsg'); m.hidden = false; m.textContent = msg; setTimeout(() => { m.textContent = 'Drop toppings here'; m.hidden = S.tops.length > 0; }, 1800); }

  let drag = null;
  tray.addEventListener('pointerdown', e => {
    const b = e.target.closest('.top'); if (!b) return;
    if (e.pointerType === 'mouse') e.preventDefault();
    drag = { id: b.dataset.id, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, el: b, pid: e.pointerId };
  });
  tray.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) {
      drag.moved = true;
      try { drag.el.setPointerCapture(drag.pid); } catch (err) {}
      const g = document.createElement('div'); g.className = 'ghost';
      g.innerHTML = `<svg viewBox="-22 -22 44 44" width="64" height="64"><g transform="scale(1.3)">${art(topById(drag.id))}</g></svg>`;
      document.body.appendChild(g); drag.ghost = g;
    }
    if (drag.ghost) { drag.ghost.style.transform = `translate(${e.clientX - 32}px, ${e.clientY - 32}px)`; $('stage').classList.toggle('hot', overStage(e)); }
  });
  const overStage = e => { const r = $('stage').getBoundingClientRect(); return e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom; };
  function endDrag(e, cancelled) {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    $('stage').classList.remove('hot');
    if (cancelled) return;
    if (!d.moved) { S.tops.includes(d.id) ? removeTop(d.id) : addTop(d.id); }
    else if (overStage(e)) addTop(d.id);
  }
  tray.addEventListener('pointerup', e => endDrag(e, false));
  tray.addEventListener('pointercancel', e => endDrag(e, true));
  tray.addEventListener('keydown', e => { const b = e.target.closest('.top'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.tops.includes(b.dataset.id) ? removeTop(b.dataset.id) : addTop(b.dataset.id); } });
  $('chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) removeTop(c.dataset.id); });

  // ---------- order ticket ----------
  const orderNo = 100 + Math.floor(Math.random() * 900);
  $('ticketNo').textContent = '#' + orderNo;
  function addToCart(item) {
    const ex = S.cart.find(c => c.key === item.key);
    if (ex) ex.qty++; else S.cart.push({ ...item, qty: 1 });
    renderTicket();
  }
  $('addBtn').onclick = () => {
    const f = fmt();
    const label = (sizeObj() ? sizeObj().label + ' ' : '') + f.name;
    addToCart({ key: label + '|' + S.tops.slice().sort().join(','), label, names: S.tops.map(id => topById(id).name), price: buildPrice(), custom: true });
    S.tops = []; renderAll();
  };
  $('lines').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (!b) return;
    const c = S.cart[+b.dataset.k]; c.qty += +b.dataset.d; if (c.qty <= 0) S.cart.splice(+b.dataset.k, 1); renderTicket(); });
  document.querySelector('.pickup').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    S.mode = b.dataset.mode; [...b.parentNode.children].forEach(x => x.classList.toggle('on', x === b)); });

  function renderTicket() {
    const L = $('lines');
    if (!S.cart.length) L.innerHTML = `<div class="line sub"><span>Nothing yet. Tap Add on a favorite, or build your own.</span></div>`;
    else L.innerHTML = S.cart.map((c, k) => `<div class="line"><span class="q"><button data-k="${k}" data-d="-1" aria-label="One less">−</button>${c.qty}<button data-k="${k}" data-d="1" aria-label="One more">+</button>&nbsp;${esc(c.label)}</span><span>${money(c.price * c.qty)}</span></div>
      ${c.custom || c.names.length ? `<div class="line sub"><span>${c.names.length ? esc(c.names.join(', ')) : 'Plain cheese'}</span></div>` : ''}`).join('');
    const tot = S.cart.reduce((s, c) => s + c.price * c.qty, 0);
    const n = S.cart.reduce((s, c) => s + c.qty, 0);
    $('total').textContent = money(tot);
    $('orderBtn').disabled = !S.cart.length;
    $('orderbar').hidden = !S.cart.length;
    $('obCount').textContent = `View order (${n})`;
    $('obTotal').textContent = money(tot);
  }
  $('orderbar').onclick = () => $('ticket').scrollIntoView({ behavior: 'smooth', block: 'center' });

  $('orderBtn').onclick = () => {
    const tot = S.cart.reduce((s, c) => s + c.price * c.qty, 0);
    const items = S.cart.reduce((s, c) => s + c.qty, 0);
    const mins = D.shop.prepMinutes || 15;
    $('doneNo').textContent = '#' + orderNo;
    $('doneMsg').textContent = `${items} item${items > 1 ? 's' : ''} · ${money(tot)} · ${S.mode} ready in about ${S.mode === 'Delivery' ? mins + 20 : mins} minutes.`;
    $('doneNote').textContent = (D.pitch && D.pitch.note) || '';
    $('overlay').hidden = false; $('again').focus();
    confetti();
  };
  $('again').onclick = () => { S.cart = []; S.tops = []; $('overlay').hidden = true; go(0); showTab('menu'); };

  function renderAll() {
    renderPizza(); renderTray(); renderTicket();
    const f = fmt();
    $('buildLabel').textContent = (sizeObj() ? sizeObj().label + ' ' : '') + f.name + (S.tops.length ? ` + ${S.tops.length} topping${S.tops.length > 1 ? 's' : ''}` : '');
    $('buildPrice').textContent = money(buildPrice());
    $('chips').innerHTML = S.tops.length ? S.tops.map(id => `<button class="chip" data-id="${id}" aria-label="Remove ${esc(topById(id).name)}">${esc(topById(id).name)}<span>×</span></button>`).join('')
      : `<span class="empty">No toppings yet. Plain cheese is a classic.</span>`;
  }

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('confetti'); c.hidden = false; const x = c.getContext('2d'); const dpr = devicePixelRatio || 1;
    const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
    const cols = ['#b3301d', '#ffcf4d', '#2e7d32', '#fbf3e2', '#e5482f'];
    const P = Array.from({ length: 140 }, () => ({ x: W / 2, y: H * 0.45, vx: (Math.random() - .5) * 26 * dpr, vy: (-Math.random() * 22 - 6) * dpr, r: (4 + Math.random() * 7) * dpr, c: cols[Math.floor(Math.random() * cols.length)] }));
    let t = 0;
    (function frame() { x.clearRect(0, 0, W, H); t++;
      P.forEach(p => { p.vy += .7 * dpr; p.x += p.vx; p.y += p.vy; p.vx *= .99; x.fillStyle = p.c; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); });
      if (t < 120) requestAnimationFrame(frame); else c.hidden = true; })();
  }

  renderMenu();
  go(0);
  showTab(location.hash === '#build' ? 'build' : 'menu');
  addEventListener('hashchange', () => showTab(location.hash === '#build' ? 'build' : 'menu'));
})();
</script>

</html>
